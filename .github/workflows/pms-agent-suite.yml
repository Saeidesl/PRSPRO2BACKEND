name: PMS agent suite

on:
  pull_request:
    branches: [main]
    paths:
      - '**.js'
      - 'tests/**'
      - 'appsscript.json'
      - 'AGENTS.md'
      - 'PMS-AGENTS.md'
      - '.github/workflows/pms-agent-suite.yml'
  push:
    branches: [main]
    paths:
      - '**.js'
      - 'tests/**'
      - 'appsscript.json'
      - 'AGENTS.md'
      - 'PMS-AGENTS.md'
      - '.github/workflows/pms-agent-suite.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pms-agent-suite-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  domain-contract-review:
    name: Domain contract review agent
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run read-only PMS domain contract review
        run: node scripts/pms-agent-audit.js

  regression-and-release-safety:
    name: QA and release safety agent
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run all backend unit and integration tests
        run: node --test tests/*.test.js
      - name: Verify Apps Script manifest and source syntax
        shell: bash
        run: |
          set -euo pipefail
          test -f appsscript.json
          node -e "JSON.parse(require('fs').readFileSync('appsscript.json', 'utf8'));"
          count=0
          declare -A names=()
          for file in *.js; do
            [ -f "$file" ] || continue
            node --check "$file"
            name="${file%.js}"
            name="${name%.gs}"
            if [[ -n "${names[$name]+x}" ]]; then
              echo "Duplicate Apps Script target name: $name.gs"
              exit 1
            fi
            names["$name"]=1
            count=$((count + 1))
          done
          if [ "$count" -lt 60 ]; then
            echo "Expected at least 60 backend source files, found $count."
            exit 1
          fi
          echo "Validated $count source files and appsscript.json."
      - name: Verify deployment workflow still has explicit safety controls
        run: node --test tests/schema-contract.test.js
