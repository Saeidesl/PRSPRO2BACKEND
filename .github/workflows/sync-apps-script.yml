name: Sync backend to Google Apps Script

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**.js'
      - 'appsscript.json'
      - '.github/workflows/sync-apps-script.yml'

permissions:
  contents: read

concurrency:
  group: apps-script-production-sync
  cancel-in-progress: false

jobs:
  validate-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate backend source and manifest
        shell: bash
        run: |
          set -euo pipefail
          test -f appsscript.json
          node -e "JSON.parse(require('fs').readFileSync('appsscript.json', 'utf8'));"
          count=0
          declare -A names=()
          for file in *.js; do
            [ -f "$file" ] || continue
            node --check "$file"
            name="${file%.js}"
            name="${name%.gs}"
            if [[ -n "${names[$name]+x}" ]]; then
              echo "Duplicate Apps Script target name: $name.gs"
              exit 1
            fi
            names["$name"]=1
            count=$((count + 1))
          done
          if [ "$count" -lt 60 ]; then
            echo "Refusing deployment: expected at least 60 backend source files, found $count."
            exit 1
          fi
          echo "Validated $count JavaScript source files and appsscript.json."

      - name: Install clasp
        run: npm install --global @google/clasp

      - name: Configure clasp credentials
        env:
          CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLASP_CREDENTIALS" || (echo "Missing CLASP_CREDENTIALS secret" && exit 1)
          printf '%s' "$CLASP_CREDENTIALS" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const file = path.join(process.env.HOME, '.clasprc.json');
          let parsed = JSON.parse(fs.readFileSync(file, 'utf8'));

          // Accept the full .clasprc.json file, clasp's legacy token object,
          // or the common token-only secret format without printing credentials.
          if (typeof parsed === 'string') parsed = JSON.parse(parsed);
          if (parsed && parsed.token && parsed.token.access_token &&
              !parsed.oauth2ClientSettings && !parsed.tokens) {
            parsed = Object.assign({}, parsed.token, {
              exprity_date: parsed.token.exprity_date || parsed.token.expiry_date
            });
          }
          if (parsed && parsed.access_token && !parsed.tokens) {
            parsed.exprity_date = parsed.exprity_date || parsed.expiry_date;
          }
          if (parsed && parsed.tokens && !parsed.tokens.default) {
            const named = Object.entries(parsed.tokens).filter(([, value]) => value);
            if (named.length === 1) parsed.tokens.default = named[0][1];
          }

          const hasV3 = parsed && parsed.tokens && parsed.tokens.default;
          const hasLegacyLocal = parsed && parsed.token && parsed.token.access_token &&
            parsed.oauth2ClientSettings && parsed.oauth2ClientSettings.clientId &&
            parsed.oauth2ClientSettings.clientSecret;
          const hasLegacyGlobal = parsed && parsed.access_token && parsed.refresh_token;
          if (!hasV3 && !hasLegacyLocal && !hasLegacyGlobal) {
            throw new Error('CLASP_CREDENTIALS must contain a supported .clasprc.json or token format.');
          }
          fs.writeFileSync(file, JSON.stringify(parsed), { mode: 0o600 });
          NODE

      - name: Prepare Apps Script source files
        env:
          SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SCRIPT_ID" || (echo "Missing APPS_SCRIPT_ID secret" && exit 1)
          mkdir -p deploy
          cp appsscript.json deploy/appsscript.json
          for file in *.js; do
            [ -f "$file" ] || continue
            name="${file%.js}"
            name="${name%.gs}"
            cp "$file" "deploy/$name.gs"
          done
          test "$(find deploy -maxdepth 1 -type f -name '*.gs' | wc -l)" -ge 60
          printf '{"scriptId":"%s","rootDir":"deploy"}\n' "$SCRIPT_ID" > .clasp.json

      - name: Push validated source to Apps Script
        run: clasp push --force

      # The deployment ID is the public identifier for the existing Web App
      # deployment, not an OAuth credential. A repository secret can override it.
      - name: Update existing Web App deployment
        env:
          DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID || 'AKfycbzHlLF_UuVZu6VIbl59EyIi4ZnLeJfssrBmo0jkn4BvrCPpqYyJ5qP71WdALtyalOKv_A' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOYMENT_ID" || (echo "Missing Web App deployment ID" && exit 1)
          clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "Automated deployment ${GITHUB_SHA:0:7}"
